name: Signal
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: signal
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signal tekshirish
        run: python3 bot_signal.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_URL: https://mamarajabovd31-creator.github.io/trade-yordamchi/
      - name: Holatni saqlash
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "holat" && git push)
